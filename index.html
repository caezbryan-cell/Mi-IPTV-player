<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi IPTV Player - PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00A8FF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0e12; color: #e1e4ed; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Header Bar */
        header { height: 50px; background: #161820; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #232733; }
        header h1 { font-size: 18px; color: #00A8FF; text-transform: uppercase; letter-spacing: 1px; }
        header .actions { display: flex; gap: 10px; }
        header button { background: #0059B2; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }

        /* Main Container */
        #app { display: flex; flex: 1; height: calc(100vh - 50px); overflow: hidden; }
        
        /* Panels */
        .sidebar { background: #12141c; border-right: 1px solid #202430; display: flex; flex-direction: column; }
        #cat-panel { width: 220px; }
        #chan-panel { width: 280px; }
        
        .panel-header { padding: 10px; border-bottom: 1px solid #202430; }
        .panel-header input { width: 100%; padding: 6px 10px; background: #090a0e; border: 1px solid #2a2f40; color: #fff; border-radius: 4px; font-size: 12px; }
        
        .nav-list { list-style: none; overflow-y: auto; flex: 1; }
        .nav-list li { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #1a1d28; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-list li:hover { background: #1c202e; }
        .nav-list li.active { background: #0059B2; color: #fff; font-weight: bold; border-left: 4px solid #00A8FF; }

        /* Main Video Screen */
        #main-viewport { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; background: #000; }
        
        #overlay-info { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.75); padding: 8px 15px; border-radius: 5px; font-size: 14px; color: #fff; pointer-events: none; }
        
        /* Responsive Layout for Mobile */
        @media (max-width: 768px) {
            #app { flex-direction: column; }
            .sidebar { width: 100% !important; height: 180px; }
            #main-viewport { height: calc(100vh - 410px); }
        }

        /* Modal */
        #modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .modal-body { background: #191c26; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; text-align: center; border: 1px solid #2e3447; }
        .modal-body input { width: 100%; padding: 10px; margin: 15px 0; background: #0d0e12; border: 1px solid #363d54; color: #fff; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>IPTV Player PWA</h1>
        <div class="actions">
            <button id="btn-change-url">Cambiar M3U</button>
            <button id="btn-install" style="display:none; background:#00a859;">Instalar App</button>
        </div>
    </header>

    <div id="app">
        <div class="sidebar" id="cat-panel">
            <div class="panel-header">
                <input type="text" id="cat-search" placeholder="Buscar categoría...">
            </div>
            <ul id="cat-list" class="nav-list"></ul>
        </div>

        <div class="sidebar" id="chan-panel">
            <div class="panel-header">
                <input type="text" id="chan-search" placeholder="Buscar canal...">
            </div>
            <ul id="chan-list" class="nav-list"></ul>
        </div>

        <div id="main-viewport">
            <video id="videoPlayer" controls autoplay></video>
            <div id="overlay-info"><span id="chan-title">Selecciona un canal</span></div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-body">
            <h3 style="color:#00A8FF;">Cargar Lista M3U</h3>
            <input type="text" id="m3u-url" value="https://iptv-org.github.io/iptv/index.m3u" placeholder="https://tu-servidor.com/lista.m3u">
            <button id="btn-load" style="padding:10px 20px; background:#0059B2; color:#fff; border:none; border-radius:4px; cursor:pointer;">Cargar Canales</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js")
                    .then(reg => console.log("SW registrado:", reg.scope))
                    .catch(err => console.log("SW error:", err));
            });
        }
    </script>
</body>
</html>
